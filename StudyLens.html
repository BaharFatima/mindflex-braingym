<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLens — CV Study Module</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* UI STYLES - PRESERVED EXACTLY */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(180deg, #B3E5FC 0%, #E1F5FE 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 320px; height: 640px; border-radius: 30px; background: linear-gradient(180deg, #BBDEFB 0%, #E3F2FD 100%); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 14px 16px 10px; color: #0D47A1; flex-shrink: 0; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #1565C0; font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif; padding: 4px 0; margin-bottom: 6px; }
    .header-title { text-align: center; }
    .header h2 { font-size: 18px; font-weight: 600; margin: 0; }
    .header p { font-size: 11px; opacity: 0.8; margin-top: 4px; }
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 16px 16px; }
    .drop-zone { flex: 1; border: 2px dashed #90CAF9; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
    .drop-zone:hover { border-color: #1E88E5; background: rgba(30, 136, 229, 0.05); }
    .drop-zone-icon { font-size: 40px; }
    .drop-zone-text { font-size: 13px; font-weight: 600; color: #1565C0; }
    .choose-file-btn { padding: 9px 22px; border-radius: 14px; border: none; background: linear-gradient(135deg, #64B5F6, #1E88E5); color: white; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .error { background: rgba(229, 62, 62, 0.07); border: 1px solid rgba(229, 62, 62, 0.25); border-radius: 14px; padding: 10px; color: #C62828; font-size: 11px; margin-bottom: 10px; }
    .processing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .progress-circle { position: relative; width: 88px; height: 88px; }
    .progress-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1565C0; }
    .step { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; border: 1px solid #E3F2FD; background: #FFF; width: 100%; }
    .step.done { background: rgba(30, 136, 229, 0.1); border-color: #90CAF9; font-weight: 600; color: #1565C0; }
    .results-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
    .flashcard-container { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .flashcard-progress { display: flex; align-items: center; gap: 8px; }
    .flashcard-bar { flex: 1; height: 4px; background: #E3F2FD; border-radius: 2px; overflow: hidden; }
    .flashcard-bar-fill { height: 100%; background: #1E88E5; width: 0%; transition: width 0.3s; }
    .flashcard-3d { flex: 1; cursor: pointer; perspective: 1000px; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s; }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 1px solid #E3F2FD; background: #FFF; }
    .flashcard-back { transform: rotateY(180deg); background: linear-gradient(160deg, #E3F2FD, #FFFFFF); }
    .flashcard-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; color: #1E88E5; }
    .nav-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; font-family: 'Poppins'; }
    .nav-btn.primary { background: #1E88E5; color: white; }
    .nav-btn.secondary { background: white; color: #1565C0; }
    .card { background: #FFF; border-radius: 14px; padding: 12px; border: 1px solid #E3F2FD; }
    .bottom-nav { height: 60px; background: #FFF; display: flex; justify-content: space-around; align-items: center; border-radius: 20px 20px 0 0; }
    .nav-tab { background: none; border: none; cursor: pointer; font-size: 10px; color: #90CAF9; display: flex; flex-direction: column; align-items: center; }
    .nav-tab.active { color: #1565C0; font-weight: 700; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="back-btn" id="backBtn">← Back</button>
    <div class="header-title">
      <h2 id="headerTitle">📚 StudyLens</h2>
      <p id="headerSubtitle">Upload a doc to generate a study set</p>
    </div>
  </div>

  <div class="content" id="uploadScreen">
    <div id="errorMsg" class="error hidden"></div>
    <div class="drop-zone" id="dropZone">
      <span class="drop-zone-icon">📂</span>
      <p class="drop-zone-text">Tap to choose a file</p>
      <button class="choose-file-btn" id="chooseBtn">Choose File</button>
      <input type="file" id="fileInput" accept=".pdf,.docx,image/*" style="display: none;">
    </div>
  </div>

  <div class="content processing hidden" id="processingScreen">
    <div class="progress-circle">
      <svg width="88" height="88" style="transform: rotate(-90deg);"><circle cx="44" cy="44" r="37" fill="none" stroke="#E3F2FD" stroke-width="6"/><circle id="progressCircle" cx="44" cy="44" r="37" fill="none" stroke="#1E88E5" stroke-width="6" stroke-dasharray="232.5" stroke-dashoffset="232.5"/></svg>
      <div class="progress-text"><span id="progressPct">0%</span></div>
    </div>
    <p id="progressMsg" style="font-size: 12px; color: #5C6BC0; text-align: center;">Initializing...</p>
    <div class="step pending" id="step1"><span>⏳</span><span style="font-size:11px">Extracting Content</span></div>
    <div class="step pending" id="step2"><span>⏳</span><span style="font-size:11px">Analyzing with AI</span></div>
  </div>

  <div class="results-content hidden" id="resultsScreen">
    <div class="content flashcard-container" id="flashcardsTab">
      <div class="flashcard-progress">
        <span id="cardCounter" style="font-size:10px; font-weight:700; color:#1565C0">0/0</span>
        <div class="flashcard-bar"><div class="flashcard-bar-fill" id="cardProgress"></div></div>
      </div>
      <div class="flashcard-3d" id="flashcard3d">
        <div class="flashcard-inner" id="flashcardInner">
          <div class="flashcard-face flashcard-front">
            <span class="flashcard-label" id="cardTerm">Flashcard</span>
            <p id="flashcardFront" style="font-size:13px">Loading question...</p>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="flashcard-label">Answer</span>
            <p id="flashcardBack" style="font-size:12px">Loading answer...</p>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:8px">
        <button class="nav-btn secondary" id="prevBtn">←</button>
        <button class="nav-btn primary" id="flipBtn">Reveal</button>
        <button class="nav-btn secondary" id="nextBtn">→</button>
      </div>
    </div>
    <div class="content scroll-area hidden" id="keypointsTab"></div>
    <div class="content scroll-area hidden" id="glossaryTab"></div>
    <div class="content scroll-area hidden" id="summaryTab"></div>

    <div class="bottom-nav">
      <button class="nav-tab active" data-tab="flashcards"><span>🃏</span><span>Cards</span></button>
      <button class="nav-tab" data-tab="keypoints"><span>✅</span><span>Points</span></button>
      <button class="nav-tab" data-tab="glossary"><span>📖</span><span>Glossary</span></button>
      <button class="nav-tab" data-tab="summary"><span>📝</span><span>Summary</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<script>
  let currentResults = null;
  let currentCardIndex = 0;
  let isFlipped = false;
  let currentFileName = "";

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // 1. CALLS THE VERCEL PROXY (Safe from leaking keys)
  async function callAIEngine(text) {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    
    if (!response.ok) throw new Error("AI Engine unreachable. Check Vercel logs.");
    
    const rawData = await response.json();
    
    // Extract the text from Gemini response structure
    let aiText = rawData.candidates[0].content.parts[0].text;
    
    // Clean up JSON if Gemini wraps it in markdown blocks
    aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
    
    return JSON.parse(aiText);
  }

  async function processFile(file) {
    if (!file) return;
    document.getElementById('errorMsg').classList.add('hidden');
    setStage('processing');
    currentFileName = file.name;

    try {
      let extractedText = '';
      updateProgress(10, 'Extracting content...');
      
      if (file.type === 'application/pdf') {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: buf}).promise;
        for(let i=1; i<=Math.min(pdf.numPages, 10); i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          extractedText += content.items.map(s => s.str).join(' ') + '\n';
        }
      } else if (file.name.endsWith('.docx')) {
        const buf = await file.arrayBuffer();
        const res = await mammoth.extractRawText({arrayBuffer: buf});
        extractedText = res.value;
      } else {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        extractedText = res.data.text;
        await worker.terminate();
      }

      document.getElementById('step1').className = 'step done';
      document.getElementById('step1').querySelector('span').textContent = '✅';
      
      updateProgress(60, 'Analyzing with AI Engine...');
      
      // CRITICAL FIX: Wait for the result before proceeding
      currentResults = await callAIEngine(extractedText);
      
      document.getElementById('step2').className = 'step done';
      document.getElementById('step2').querySelector('span').textContent = '✅';
      updateProgress(100, 'Complete!');

      setTimeout(() => {
        setStage('results');
        updateFlashcard(); // Now safe to call
        renderKeyPoints();
        renderGlossary();
        renderSummary();
      }, 400);

    } catch (e) {
      console.error(e);
      showError("Analysis failed: " + e.message);
      setStage('upload');
    }
  }

  function setStage(stage) {
    document.getElementById('uploadScreen').classList.toggle('hidden', stage !== 'upload');
    document.getElementById('processingScreen').classList.toggle('hidden', stage !== 'processing');
    document.getElementById('resultsScreen').classList.toggle('hidden', stage !== 'results');
    
    if (stage === 'results' && currentResults) {
      const wordCount = currentResults.wordCount || 0;
      const cardCount = currentResults.flashcards ? currentResults.flashcards.length : 0;
      document.getElementById('headerTitle').textContent = currentFileName;
      document.getElementById('headerSubtitle').textContent = `${wordCount.toLocaleString()} words · ${cardCount} cards`;
    }
  }

  function updateFlashcard() {
    // CRASH GUARD: Check if flashcards exist
    if (!currentResults || !currentResults.flashcards || currentResults.flashcards.length === 0) {
      document.getElementById('flashcardFront').textContent = "No flashcards generated.";
      document.getElementById('flashcardBack').textContent = "Try a longer document.";
      return;
    }

    const card = currentResults.flashcards[currentCardIndex];
    document.getElementById('flashcardFront').textContent = card.front;
    document.getElementById('flashcardBack').textContent = card.back;
    document.getElementById('cardTerm').textContent = card.term || "Concept";
    document.getElementById('cardCounter').textContent = `${currentCardIndex + 1}/${currentResults.flashcards.length}`;
    document.getElementById('cardProgress').style.width = `${((currentCardIndex + 1) / currentResults.flashcards.length) * 100}%`;
  }

  function renderKeyPoints() {
    const container = document.getElementById('keypointsTab');
    if (!currentResults.keyPoints) return;
    container.innerHTML = currentResults.keyPoints.map((p, i) => `
      <div class="card"><small style="color:#1E88E5; font-weight:700">POINT ${i+1}</small><p style="font-size:12px; margin-top:4px;">${p}</p></div>
    `).join('');
  }

  function renderGlossary() {
    const container = document.getElementById('glossaryTab');
    if (!currentResults.glossary) return;
    container.innerHTML = currentResults.glossary.map(g => `
      <div class="card"><b style="color:#1E88E5">${g.term}</b><p style="font-size:11px; color:#5C6BC0; margin-top:4px;">${g.definition}</p></div>
    `).join('');
  }

  function renderSummary() {
    document.getElementById('summaryTab').innerHTML = `<div class="card"><p style="font-size:12px; line-height:1.6">${currentResults.summary || 'No summary available.'}</p></div>`;
  }

  function updateProgress(pct, msg) {
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressMsg').textContent = msg;
    document.getElementById('progressCircle').style.strokeDashoffset = 232.5 * (1 - pct/100);
  }

  function showError(m) {
    const e = document.getElementById('errorMsg');
    e.textContent = "⚠️ " + m;
    e.classList.remove('hidden');
  }

  // EVENT LISTENERS
  document.getElementById('fileInput').onchange = (e) => processFile(e.target.files[0]);
  document.getElementById('chooseBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
  
  document.getElementById('flipBtn').onclick = () => {
    isFlipped = !isFlipped;
    document.getElementById('flashcardInner').classList.toggle('flipped');
    document.getElementById('flipBtn').textContent = isFlipped ? 'Question' : 'Reveal';
  };

  document.getElementById('nextBtn').onclick = () => {
    if(currentCardIndex < currentResults.flashcards.length - 1) {
      currentCardIndex++;
      isFlipped = false;
      document.getElementById('flashcardInner').classList.remove('flipped');
      document.getElementById('flipBtn').textContent = 'Reveal';
      updateFlashcard();
    }
  };

  document.getElementById('prevBtn').onclick = () => {
    if(currentCardIndex > 0) {
      currentCardIndex--;
      isFlipped = false;
      document.getElementById('flashcardInner').classList.remove('flipped');
      document.getElementById('flipBtn').textContent = 'Reveal';
      updateFlashcard();
    }
  };

  document.querySelectorAll('.nav-tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    ['flashcards','keypoints','glossary','summary'].forEach(id => {
      document.getElementById(id+'Tab').classList.toggle('hidden', id !== t.dataset.tab);
    });
  });

  document.getElementById('backBtn').onclick = () => {
    setStage('upload');
    currentResults = null;
    currentCardIndex = 0;
  };
</script>
</body>
</html>
