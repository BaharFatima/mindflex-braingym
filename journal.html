<script>

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let allEntries = [];

auth.onAuthStateChanged(async user => {
  if (user) loadEntries(user.uid);
  else window.location.href = "login.html";
});

// ── Sentiment label → number ──────────────────────────────────
// Handles old labels ("positive","negative","neutral") AND
// new rich labels ("Very Positive", "Slightly Negative", etc.)
function sentimentToScore(label) {
  if (!label) return 0;
  const l = label.toLowerCase();
  if (l.includes("very pos"))      return  2;
  if (l.includes("slightly pos"))  return  0.5;
  if (l === "positive" || (l.includes("pos") && !l.includes("slightly"))) return 1;
  if (l.includes("very neg"))      return -2;
  if (l.includes("slightly neg"))  return -0.5;
  if (l === "negative" || (l.includes("neg") && !l.includes("slightly"))) return -1;
  return 0;
}

function scoreToColor(score, alpha=1) {
  if (score >= 1.5)  return `rgba(46,204,113,${alpha})`;
  if (score >= 0.3)  return `rgba(109,168,255,${alpha})`;
  if (score >= -0.3) return `rgba(160,180,200,${alpha})`;
  if (score >= -1.5) return `rgba(230,150,50,${alpha})`;
  return `rgba(231,76,60,${alpha})`;
}

// ════════════════════════════════════════════════════════════════
//  compromise.js  TF-IDF keyword extractor
//  Runs over ALL entry contents, extracts nouns via POS tagging,
//  scores them by TF-IDF, returns top keywords with weights
// ════════════════════════════════════════════════════════════════
function computeKeywords(entries) {
  const stopwords = new Set([
    "i","me","my","we","our","you","your","he","she","they","it","its",
    "the","a","an","this","that","these","those","is","are","was","were",
    "be","been","being","have","has","had","do","does","did","will","would",
    "could","should","may","might","shall","can","just","really","very",
    "so","also","too","then","now","day","time","thing","way","lot","bit",
    "today","yesterday","tomorrow","week","month","year","morning","night",
    "got","get","go","going","come","came","came","feel","felt","know",
    "think","thought","want","need","make","made","see","look","say","said",
    "back","good","great","well","little","much","many","more","some",
  ]);

  // Build corpus: one "document" per entry using compromise noun extraction
  const documents = entries.map(e => {
    if (!e.content) return [];
    try {
      return nlp(e.content)
        .nouns()
        .not("#Pronoun")
        .out("array")
        .map(w => w.toLowerCase().trim().replace(/[^a-z]/g,""))
        .filter(w => w.length > 2 && !stopwords.has(w));
    } catch(err) {
      return e.content.toLowerCase().split(/\s+/)
        .filter(w => w.length > 3 && !stopwords.has(w));
    }
  });

  const totalDocs = documents.length || 1;

  // Term frequency across all docs combined
  const tf = {};
  // Document frequency (how many docs contain this term)
  const df = {};

  documents.forEach(doc => {
    const seen = new Set();
    doc.forEach(word => {
      tf[word] = (tf[word] || 0) + 1;
      if (!seen.has(word)) {
        df[word] = (df[word] || 0) + 1;
        seen.add(word);
      }
    });
  });

  // TF-IDF score
  const scores = {};
  Object.keys(tf).forEach(word => {
    const idf = Math.log((totalDocs + 1) / (df[word] + 1)) + 1;
    scores[word] = tf[word] * idf;
  });

  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 15);
}

function renderKeywords(keywords) {
  const cloud = document.getElementById("keywordCloud");
  cloud.innerHTML = "";
  if (!keywords.length) {
    document.getElementById("keywordCard").style.display = "none";
    return;
  }

  const maxScore = keywords[0][1];
  const palette = [
    "#3b82f6","#7c3aed","#0ea5e9","#10b981",
    "#f59e0b","#e74c3c","#ec4899","#06b6d4",
    "#8b5cf6","#059669","#d97706","#be123c",
    "#0284c7","#7e22ce","#047857",
  ];

  keywords.forEach(([word, score], i) => {
    const weight = score / maxScore; // 0-1
    const size   = Math.round(10 + weight * 6); // 10-16px
    const tag    = document.createElement("span");
    tag.className = "kw-tag";
    tag.textContent = word;
    tag.style.background = palette[i % palette.length];
    tag.style.fontSize   = size + "px";
    tag.style.opacity    = 0.65 + weight * 0.35;
    cloud.appendChild(tag);
  });
}

// ── Load entries ──────────────────────────────────────────────
async function loadEntries(uid) {
  allEntries = [];
  document.getElementById("entries").innerHTML = "";

  const snapshot = await db
    .collection("users").doc(uid)
    .collection("journal")
    .orderBy("savedAt","desc")
    .get();

  if (snapshot.empty) {
    document.getElementById("emptyMsg").style.display = "block";
    return;
  }
  document.getElementById("emptyMsg").style.display = "none";

  snapshot.forEach(doc => {
    const data = doc.data();
    allEntries.push(data);
    const docId = doc.id;
    const score = sentimentToScore(data.sentiment);

    const card = document.createElement("div");
    card.className = "entry-card";
    card.style.borderLeft = `4px solid ${scoreToColor(score)}`;

    card.innerHTML = `
      <div class="entry-top">
        <div class="entry-title">${escapeHtml(data.title||"Untitled")}</div>
        <div class="entry-date">${data.savedAt?data.savedAt.toDate().toLocaleString():""}</div>
      </div>
      <div class="entry-snippet">${escapeHtml((data.content||"").slice(0,160))}</div>
      <div class="entry-actions">
        <button class="small-btn" data-id="${docId}">Delete</button>
        <span class="entry-sentiment" style="color:${scoreToColor(score)}">${data.sentiment||"—"}</span>
      </div>`;

    card.querySelector("button").onclick = async () => {
      if (!confirm("Delete this entry?")) return;
      await db.collection("users").doc(auth.currentUser.uid)
               .collection("journal").doc(docId).delete();
      loadEntries(auth.currentUser.uid);
    };
    document.getElementById("entries").appendChild(card);
  });

  drawMoodChart();
  drawStressChart();
  drawEmotionChart();
  // compromise.js TF-IDF keyword extraction
  const keywords = computeKeywords(allEntries);
  renderKeywords(keywords);
  generateWeeklySummary(allEntries);
  generateInsights(allEntries);
}

// ── CHART 1: Mood Trend ───────────────────────────────────────
function drawMoodChart() {
  if (!allEntries.length) return;
  if (moodInst) moodInst.destroy();

  const ordered = [...allEntries].reverse();
  const scores  = ordered.map(e => sentimentToScore(e.sentiment));
  const labels  = ordered.map((_,i) => "E"+(i+1));
  const ptColors = scores.map(s => scoreToColor(s));

  moodInst = new Chart(document.getElementById("moodChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: scores,
        tension: 0.4,
        borderColor: "#6da8ff",
        borderWidth: 2.5,
        pointBackgroundColor: ptColors,
        pointBorderColor: "#fff",
        pointBorderWidth: 2,
        pointRadius: 6,
        fill: true,
        backgroundColor: "rgba(109,168,255,0.08)",
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const s=ctx.raw;
              if(s>=1.5) return "Very Positive";
              if(s>=0.3) return "Positive";
              if(s>=-0.3) return "Neutral";
              if(s>=-1.5) return "Negative";
              return "Very Negative";
            }
          }
        }
      },
      scales: {
        y: {
          min:-2, max:2,
          ticks: {
            stepSize:1, color:"#789", font:{size:10},
            callback: v=>({2:"Very +",1:"Pos",0:"Neutral","-1":"Neg","-2":"Very -"}[v]||"")
          },
          grid:{color:"rgba(109,168,255,0.08)"}
        },
        x: { ticks:{color:"#789",font:{size:10}}, grid:{display:false} }
      }
    }
  });
}

// ── CHART 2: Stress Sources ───────────────────────────────────
function drawStressChart() {
  if (!allEntries.length) return;
  if (stressInst) stressInst.destroy();

  const counts = { Academic:0, Work:0, Relationships:0, Health:0, Finances:0, Growth:0 };

  allEntries.forEach(e => {
    if (sentimentToScore(e.sentiment) >= 0) return;
    const cats = e.categories || e.topics || [];
    cats.forEach(c => {
      const key = Object.keys(counts).find(k => k.toLowerCase() === c.toLowerCase());
      if (key) counts[key]++;
    });
  });

  const labels = Object.keys(counts).filter(k=>counts[k]>0);
  const data   = labels.map(k=>counts[k]);

  if (!data.length) {
    document.getElementById("stressChart").closest(".chart-card").style.display="none";
    return;
  }

  const palette = ["#e74c3c","#f39c12","#9b59b6","#3498db","#1abc9c","#e67e22"];

  stressInst = new Chart(document.getElementById("stressChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: labels.map((_,i)=>palette[i%palette.length]+"cc"),
        borderColor:      labels.map((_,i)=>palette[i%palette.length]),
        borderWidth: 1.5,
        borderRadius: 7,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend:{display:false} },
      scales: {
        y: { beginAtZero:true, ticks:{stepSize:1,color:"#789",font:{size:10}}, grid:{color:"rgba(109,168,255,0.08)"} },
        x: { ticks:{color:"#789",font:{size:10}}, grid:{display:false} }
      }
    }
  });
}

// ── CHART 3: Emotion Distribution ─────────────────────────────
function drawEmotionChart() {
  if (!allEntries.length) return;
  if (emotionInst) emotionInst.destroy();

  const counts = {};
  allEntries.forEach(e => {
    (e.emotions||[]).forEach(em => { counts[em]=(counts[em]||0)+1; });
  });

  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if (!sorted.length) {
    document.getElementById("emotionChart").closest(".chart-card").style.display="none";
    return;
  }

  const palette=["#6da8ff","#7c3aed","#0ea5e9","#10b981","#f59e0b","#e74c3c","#ec4899","#06b6d4"];

  emotionInst = new Chart(document.getElementById("emotionChart"), {
    type: "doughnut",
    data: {
      labels: sorted.map(([e])=>e),
      datasets: [{
        data: sorted.map(([,v])=>v),
        backgroundColor: palette.map(c=>c+"cc"),
        borderColor: palette,
        borderWidth: 2,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      cutout: "62%",
      plugins: {
        legend: {
          display: true, position:"bottom",
          labels:{font:{size:10,family:"Poppins"},color:"#0f2b45",boxWidth:10,padding:8}
        }
      }
    }
  });
}

// ── Weekly Summary ────────────────────────────────────────────
function generateWeeklySummary(entries) {
  const now=new Date(), weekAgo=new Date();
  weekAgo.setDate(now.getDate()-7);
  const weekly=entries.filter(e=>e.savedAt&&e.savedAt.toDate()>=weekAgo);

  let pos=0,neg=0,neu=0;
  const emotionCount={};
  let totalWbi=0,wbiCount=0;

  weekly.forEach(e=>{
    const s=sentimentToScore(e.sentiment);
    if(s>0.2) pos++; else if(s<-0.2) neg++; else neu++;
    if(typeof e.wellbeingScore==="number"){totalWbi+=e.wellbeingScore;wbiCount++;}
    (e.emotions||[]).forEach(em=>{emotionCount[em]=(emotionCount[em]||0)+1;});
  });

  const topEmotions=Object.entries(emotionCount).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([e])=>e);
  const avgWbi=wbiCount?Math.round(totalWbi/wbiCount):null;

  document.getElementById("weeklySummary").innerHTML=`
    <div class="summary-title">Weekly Mood Summary</div>
    <div class="summary-grid">
      <div class="summary-stat pos"><div class="summary-stat-val">${pos}</div><div class="summary-stat-lbl">Positive</div></div>
      <div class="summary-stat neg"><div class="summary-stat-val">${neg}</div><div class="summary-stat-lbl">Negative</div></div>
      <div class="summary-stat neu"><div class="summary-stat-val">${neu}</div><div class="summary-stat-lbl">Neutral</div></div>
      <div class="summary-stat"><div class="summary-stat-val">${avgWbi!==null?avgWbi+"/100":"—"}</div><div class="summary-stat-lbl">Avg WBI</div></div>
    </div>
    ${topEmotions.length?`
      <div style="font-size:11px;font-weight:700;color:#789;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Top Emotions</div>
      <div class="emotion-pills">${topEmotions.map(e=>`<span class="emotion-pill">${e}</span>`).join("")}</div>`:""}`;
}

// ── Behavior Insights ─────────────────────────────────────────
function generateInsights(entries) {
  const insights=[];

  let negStreak=0,maxStreak=0;
  [...entries].reverse().forEach(e=>{
    if(sentimentToScore(e.sentiment)<-0.2){negStreak++;maxStreak=Math.max(maxStreak,negStreak);}
    else negStreak=0;
  });
  if(maxStreak>=3) insights.push({icon:"📉",text:`${maxStreak} consecutive negative entries detected. Consider reviewing what's been weighing on you.`});

  const anxCount=entries.filter(e=>(e.emotions||[]).includes("anxiety")).length;
  if(anxCount>=2) insights.push({icon:"😰",text:`Anxiety appeared in ${anxCount} entries. Grounding techniques like deep breathing may help.`});

  const sleepNeg=entries.filter(e=>e.sleepHours<=5&&sentimentToScore(e.sentiment)<-0.2).length;
  if(sleepNeg>=2) insights.push({icon:"😴",text:`Low sleep (≤5hrs) correlated with negative mood in ${sleepNeg} entries.`});

  const burnout=entries.filter(e=>(e.emotions||[]).includes("burnout")).length;
  if(burnout>=2) insights.push({icon:"🥱",text:`Burnout signals in ${burnout} entries. Rest and recovery are priorities.`});

  const distEntries=entries.filter(e=>(e.cognitiveDistortions||[]).length>0);
  if(distEntries.length>=2){
    const top=[...new Set(distEntries.flatMap(e=>e.cognitiveDistortions||[]))].slice(0,2).join(", ");
    insights.push({icon:"🧠",text:`Recurring thought patterns: ${top}. Awareness is the first step to reframing.`});
  }

  let posStreak=0,maxPos=0;
  [...entries].reverse().forEach(e=>{
    if(sentimentToScore(e.sentiment)>0.2){posStreak++;maxPos=Math.max(maxPos,posStreak);}
    else posStreak=0;
  });
  if(maxPos>=3) insights.push({icon:"🌟",text:`${maxPos} positive entries in a row! Keep up what's working.`});

  if(!insights.length) insights.push({icon:"📖",text:"Keep journaling — patterns will emerge over time."});

  document.getElementById("insightsBox").innerHTML=`
    <div class="summary-title">Behavior Insights</div>
    ${insights.map(i=>`<div class="insight-item"><span class="insight-icon">${i.icon}</span><span>${i.text}</span></div>`).join("")}`;
}

function escapeHtml(s) {
  return (s+"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("fabAdd").onclick=()=>{window.location.href="journal-create.html";};
document.getElementById("clearAllBtn").onclick=async()=>{
  if(!confirm("Clear ALL entries?")) return;
  const snap=await db.collection("users").doc(auth.currentUser.uid).collection("journal").get();
  const batch=db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  loadEntries(auth.currentUser.uid);
};
</script>
</body>
