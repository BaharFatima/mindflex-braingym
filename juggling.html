
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juggling Cones</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#E5E7EB;
  font-family:'Poppins',sans-serif;
}

/* APP CONTAINER */
#appContainer{
  width:320px;
  height:620px;
  border-radius:30px;
  background:linear-gradient(180deg,#BBDEFB 0%, #E3F2FD 100%);
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  padding:18px;
  box-sizing:border-box;
	 z-index: 10;           /* ← add this */
  pointer-events: auto;
}

/* Decorative bubbles */
#appContainer::before{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:rgba(255,255,255,0.25);
  top:-70px;
  right:-60px;
}

#appContainer::after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  background:rgba(255,255,255,0.18);
  bottom:-60px;
  left:-50px;
}

/* HEADER */
header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-weight:600;
  font-size:18px;
  color:#0D47A1;
  z-index:2;
}

/* Glass Back Button */
.back-btn{
  position:absolute;
  left:5px;
  width:40px;
  height:40px;
  border-radius:14px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  text-decoration:none;
  color:#1565C0;
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
  transition:.2s;
}

.back-btn:hover{
  transform:scale(1.05);
}

/* INFO PANEL */
#infoPanel{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:600;
  margin-bottom:8px;
  color:#0D47A1;
}

/* GAME AREA */
#gameArea{
  flex:1;
  border-radius:20px;
  background:rgba(255,255,255,0.65);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  align-items:flex-end;
  position:relative;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
	 z-index: 5;  /* ← add this */
}

/* CONES */
.cone{
  width:55px;
  height:80px;
  background:linear-gradient(to top,#FFB74D,#FF9800);
  clip-path:polygon(50% 0%,0% 100%,100% 100%);
  cursor:pointer;
  position:absolute;
  bottom:0;
  border-radius:8px;
  transition:left .5s ease,bottom .3s ease,transform .3s;
}

.cone:hover{
  transform:scale(1.08);
}

/* BALL */
.ball{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#E53935;
  position:absolute;
  bottom:80px;
  display:none;
  transition:left .5s ease,bottom .3s ease;
}

/* MESSAGE */
#message{
  margin-top:6px;
  font-size:14px;
  font-weight:600;
  color:#0D47A1;
  text-align:center;
  min-height:20px;
}

/* NEXT BUTTON */
button{
  margin-top:10px;
  padding:10px;
  font-size:14px;
  border:none;
  background:#1565C0;
  color:white;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(21,101,192,0.4);
  display:none;
}
#resetBtn {
	position: absolute;
  right: 1px;  
  display: block;
  margin: 6px auto 0 auto;
  background: #E53935;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
 }
#resetBtn:hover {
  background: #B71C1C;
}
.title{
position: absolute;
  right: 90px;  
  font-size:18px;
  font-weight:700;
  color:#0D47A1;
}

</style>
</head>
<body>

<div id="appContainer">

<header>
  <a href="../focuslab.html" class="back-btn">←</a>
  <div class="title">Juggling Cones</div> <button id="resetBtn">Reset</button>
</header>

<div id="infoPanel">
  <div id="levelBar">Level 1 / 50 • Sub-Level 1 / 5</div>
  <div id="timer">Time: 01:00</div>
</div>

<div id="gameArea"></div>
<div id="message"></div>
<button id="nextBtn">Next Sub-Level</button>

</div>

<script type="module">
import { saveSession } from "./saveSession.js";
import { addXP } from "./xp.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔥 PUT YOUR REAL FIREBASE CONFIG HERE */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
    apiKey: "AIzaSyD9bnmF1N44Nkuk3WZQjK9z4gRE00VRmCY",
  authDomain: "mindflex-b2a0c.firebaseapp.com",
  projectId: "mindflex-b2a0c",
  storageBucket: "mindflex-b2a0c.firebasestorage.app",
  messagingSenderId: "148676867562",
  appId: "1:148676867562:web:3365a72b6fa6b3751cee93",
  measurementId: "G-Q2T6HD3S0E"
};



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    loadProgress();
  } else {
    window.location.href = "../login.html"; // redirect if not logged in
  }
});

/* GAME CONSTANTS */
const TOTAL_CONES = 6;
const TOTAL_LEVELS = 50;
const SUBLEVELS = [60,120,150,180,198];

let level = 1;
let subLevel = 1;
let timeLeft;
let timerInterval;
let cones=[], conePositions=[], ballIndex=0;
let shuffling=false;

const gameArea = document.getElementById('gameArea');
const levelBar = document.getElementById('levelBar');
const timerEl = document.getElementById('timer');
const messageEl = document.getElementById('message');
const nextBtn = document.getElementById('nextBtn');

/* LOAD PROGRESS */
// ✅ NEW
async function loadProgress(){
  if(!currentUser) return;
  try {
    const snap = await getDoc(doc(db, "users", currentUser.uid, "games", "jugglingCones"));
    if(snap.exists()){
      const data = snap.data();
      level    = data.level    || 1;
      subLevel = data.subLevel || 1;
    }
  } catch(e) {
    console.log("Load error:", e);
  }
  startGame();
}
/* SAVE */
// ✅ NEW
async function saveProgress(){
  if(!currentUser) return;
  await setDoc(
    doc(db, "users", currentUser.uid, "games", "jugglingCones"),
    { level, subLevel, lastPlayed: new Date() },
    { merge: true }
  );
}
/* UI */
function updateUI(){
  levelBar.textContent = `Level ${level} / ${TOTAL_LEVELS} • Sub-Level ${subLevel} / 5`;
  let mins = Math.floor(timeLeft/60).toString().padStart(2,'0');
  let secs = (timeLeft%60).toString().padStart(2,'0');
  timerEl.textContent = `Time: ${mins}:${secs}`;
}

/* TIMER */
function startTimer(){
  clearInterval(timerInterval);
  timeLeft = SUBLEVELS[subLevel-1];
  updateUI();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateUI();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      messageEl.textContent="Time's up! Guess now.";
    }
  },1000);
}

/* CREATE CONES */
function createCones(){
  cones=[]; conePositions=[];
  gameArea.innerHTML='';
  nextBtn.style.display='none';

  const areaWidth = gameArea.clientWidth;
  const spacing = areaWidth/TOTAL_CONES;

  for(let i=0;i<TOTAL_CONES;i++){
    const cone=document.createElement('div');
    cone.className='cone';
    const x = spacing*i+spacing/2-27;
    cone.style.left=x+'px';
    gameArea.appendChild(cone);
    cones.push(cone);
    conePositions.push(x);
  }

  ballIndex=Math.floor(Math.random()*TOTAL_CONES);
  const ball=document.createElement('div');
  ball.className='ball';
  gameArea.appendChild(ball);
  ball.style.left=conePositions[ballIndex]+16+'px';
  ball.style.display='block';

  setTimeout(()=>{
    ball.style.display='none';
    startShuffling(ball);
  },1000);

  cones.forEach((c,i)=>c.onclick=()=>checkBall(i,ball));
}

/* SHUFFLE */
function startShuffling(ball){
  shuffling=true;
  let swaps=Math.min(10+level,20);
  let delay=Math.max(300,1000-level*10);
  let count=0;

  function swap(){
    if(count>=swaps){
      shuffling=false;
      messageEl.textContent="Guess the cone!";
      return;
    }

    let i=Math.floor(Math.random()*TOTAL_CONES);
    let j;
    do{j=Math.floor(Math.random()*TOTAL_CONES);}while(j===i);

    const temp=conePositions[i];
    conePositions[i]=conePositions[j];
    conePositions[j]=temp;

    cones[i].style.left=conePositions[i]+'px';
    cones[j].style.left=conePositions[j]+'px';

    if(ballIndex===i) ball.style.left=conePositions[i]+16+'px';
    else if(ballIndex===j) ball.style.left=conePositions[j]+16+'px';

    count++;
    setTimeout(swap,delay);
  }

  swap();
}

/* CHECK */
function checkBall(idx,ball){
  if(shuffling) return;

  if(idx===ballIndex){
    ball.style.display='block';
    messageEl.textContent="Correct!";
    clearInterval(timerInterval);
    nextBtn.style.display='block';
    addXP(db, currentUser, 10); // ← 10 XP for correct guess
  }else{
    messageEl.textContent="Wrong! Reshuffling...";
    setTimeout(()=>startShuffling(ball),800);
  }
}
/* NEXT */
async function nextSubLevel(){
  saveSession("jugglingCones", db, currentUser); // ← saves session
  subLevel++;
  if(subLevel>5){
    subLevel=1;
    level++;
    if(level>TOTAL_LEVELS) level=1;
  }
  await saveProgress();
  startGame();
}

/* START */
function startGame(){
  messageEl.textContent='';
  createCones();
  startTimer();
  updateUI();
}

nextBtn.onclick=nextSubLevel;
document.getElementById('resetBtn').onclick = () => {
  level = 1;
  generateLevel();
};


</script>

</body>
</html>
